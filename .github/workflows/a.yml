name: get profiles
on:
  workflow_dispatch:
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - run: echo '"$profiles"' > a.json
        env:
          profiles: ${{ secrets.TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          path: a.json
          retention-days: 1
          archive: false
